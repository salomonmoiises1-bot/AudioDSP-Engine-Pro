# Project-wide Gradle settings.
# Tuned for Android builds on devices with limited RAM.
org.gradle.jvmargs=-Xmx1g -Xms128m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx512m -Xms128m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
