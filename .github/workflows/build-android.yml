name: Build WaveEQ Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Modern Gradle Manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.6/bin" >> $GITHUB_PATH

      - name: Accept Licenses and Install Build Tools
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n24333f8a43b680d230493639a03630f406ad9bef\nd56f5187479451eabf01fb78af6dfcb131a648b0" > $ANDROID_HOME/licenses/android-sdk-license
          sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build with Gradle
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
